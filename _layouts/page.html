---
layout: default
---

<article class="article-container">
  <header class="article-header">
    {% if page.category %}
      <span class="article-category">
        {% case page.category %}
          {% when "product" %}📱 제품 리뷰
          {% when "movie" %}🎬 영화 리뷰
          {% when "food" %}🍳 음식 & 레시피
          {% when "anime" %}⚡ 애니메이션
          {% else %}{{ page.category }}
        {% endcase %}
      </span>
    {% endif %}
    <h1 class="article-title">{{ page.title }}</h1>
  </header>

  <div class="article-body">
    {{ content }}
  </div>
</article>
