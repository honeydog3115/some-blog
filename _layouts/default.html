<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="{{ '/' | relative_url }}" class="site-title">
        ✨ {{ site.title }}
      </a>

      <nav>
        <ul class="nav-menu">
          {% for item in site.navigation %}
            <li>
              <a href="{{ item.url | relative_url }}" class="nav-link {% if page.url == item.url %}active{% endif %}">
                {{ item.title }}
              </a>
            </li>
          {% endfor %}
        </ul>
      </nav>

      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="테마 전환">
          <span id="theme-icon">🌙</span>
          <span id="theme-text">다크모드</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-wrapper">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
      <p style="margin-top: 0.4rem; color: var(--text-muted); font-size: 0.85rem;">
        직장인을 위한 모던 3분 컷 리뷰 블로그
      </p>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
